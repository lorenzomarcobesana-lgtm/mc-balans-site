<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Balans</title>
<style>
:root{--paper:#F8F5EE;--white:#FFFFFF;--ink:#1C2B27;--jade:#3A5A50;--jade-dark:#26382F;--jade-tint:#E9EEE7;--amber:#B5793C;--amber-tint:#F1E3CC;--red:#A23B2C;--mist:#E1E7E0;--stone:#6B6A63;--line:rgba(28,43,39,0.14);--font-display:'Fraunces',serif;--font-body:'Inter',sans-serif;--font-mono:'IBM Plex Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--paper);color:var(--ink);line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
header.site{position:sticky;top:0;z-index:50;background:rgba(248,245,238,0.95);border-bottom:1px solid var(--line)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:15px 32px;max-width:1180px;margin:0 auto;gap:24px}
.logo{font-family:var(--font-display);font-size:22px;font-weight:600;cursor:pointer}.logo .dot{color:var(--red)}
nav.main-nav{display:flex;gap:2px}nav.main-nav a{font-size:13.5px;color:var(--ink);opacity:.7;cursor:pointer;padding:8px 13px;border-radius:2px}nav.main-nav a:hover{opacity:1;background:var(--jade-tint)}
.header-right{display:flex;align-items:center;gap:12px}
.lang-select{display:flex;gap:4px}.lang-select button{background:transparent;border:1px solid var(--line);padding:4px 8px;font-size:12px;cursor:pointer;border-radius:4px}.lang-select button.active{background:var(--jade);color:#fff;border-color:var(--jade)}
.ask-mini{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:2px;padding:9px 14px;min-width:200px;color:var(--stone);font-size:12.5px;position:relative}
.ask-mini input{border:none;outline:none;background:transparent;font-size:12.5px;color:var(--ink);width:100%}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:2px;border:1px solid transparent;white-space:nowrap;cursor:pointer}
.btn-primary{background:var(--jade);color:#fff}.btn-primary:hover{background:var(--jade-dark)}
.hero{padding:56px 0 0}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero h1{font-family:var(--font-display);font-size:45px;line-height:1.1;margin-bottom:20px}.hero h1 em{font-style:italic;color:var(--jade);font-weight:500}
.hero p.lede{font-size:16.5px;color:var(--stone);max-width:46ch;margin-bottom:26px}
.ask-band{background:var(--jade);margin-top:60px;padding:26px 32px}.ask-band .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-tint)}.ask-band h3{color:#fff;font-size:19px;margin:6px 0 0}
.section{padding:64px 32px}.section-head{max-width:640px;margin-bottom:44px}.section-head h2{font-family:var(--font-display);font-size:31px;margin-top:10px}.section-head p{color:var(--stone);font-size:15px;margin-top:12px}
.cred-section{background:var(--ink);color:var(--paper);padding:64px 32px}.cred-section h2{color:#fff;text-align:center;font-size:32px;margin-bottom:40px}.cred-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.cred-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);padding:26px 22px;border-radius:2px}.cred-card .num{font-size:36px;color:var(--amber);margin-bottom:12px}.cred-card h3{color:#fff;font-size:18px;margin-bottom:8px}.cred-card p{color:rgba(255,255,255,.7);font-size:13.5px}
.cond-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.cond-card{background:var(--white);border:1px solid var(--line);padding:26px;border-radius:2px;cursor:pointer;transition:transform .15s;min-height:172px;position:relative}.cond-card::before{content:'';position:absolute;top:0;left:22px;width:34px;height:8px;background:var(--amber-tint);border-radius:0 0 3px 3px}.cond-card:hover{transform:translateY(-2px)}.cond-card .tag{font-family:var(--font-mono);font-size:10.5px;color:var(--amber);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}.cond-card h4{font-size:19px;margin-bottom:8px}.cond-card p{font-size:13.3px;color:var(--stone)}.cond-card .arrow{margin-top:16px;font-size:13px;color:var(--jade);font-weight:600}
.lin-section{background:var(--ink);color:var(--paper);padding:92px 0}.lin-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:center}.lin-section h2{color:#fff;font-size:29px;margin:14px 0 18px}.lin-section p.body{color:rgba(250,248,243,.72);font-size:15px;max-width:56ch}
.resource-card{background:var(--white);border:1px solid var(--line);border-radius:2px;padding:28px;display:flex;gap:26px;align-items:center}.resource-badge{font-family:var(--font-mono);font-size:10.5px;background:var(--jade-tint);color:var(--jade);padding:6px 12px;border-radius:100px;text-transform:uppercase}
footer.site{background:var(--jade-dark);color:rgba(250,248,243,.8);padding:60px 0 26px}.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px}.footer-grid h5{color:#fff;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px}.footer-grid a,.footer-grid p{display:block;font-size:13.5px;color:rgba(250,248,243,.72);margin-bottom:10px;cursor:pointer}.footer-bottom{border-top:1px solid rgba(250,248,243,.15);padding-top:20px;font-size:12px;color:rgba(250,248,243,.5)}
.subhero{padding:44px 0 38px;border-bottom:1px solid var(--line)}.breadcrumb{font-family:var(--font-mono);font-size:12px;color:var(--stone);margin-bottom:16px}.breadcrumb a{color:var(--jade);cursor:pointer}.subhero h1{font-size:34px;margin-bottom:14px}.subhero p.lede{color:var(--stone);font-size:15px;max-width:70ch}
.condition-content{max-width:800px;margin:0 auto;padding:40px 32px}.condition-content h2{font-size:24px;margin:32px 0 16px}.condition-content p{margin-bottom:16px}
.faq-item{border-top:1px solid var(--line);padding:15px 0}.faq-item .q{font-weight:600;margin-bottom:5px}.faq-item .a{color:var(--stone);font-size:14px}
.placeholder-box{background:var(--mist);border:1px dashed var(--line);border-radius:2px;padding:40px;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--stone)}
.about-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:24px}.about-tab{font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:11px 18px 9px;background:var(--mist);color:var(--stone);cursor:pointer;border-radius:4px 4px 0 0;border:1px solid var(--line);border-bottom:none}.about-tab.active{background:var(--white);color:var(--ink);font-weight:600}.about-panel{display:none;border-top:1px solid var(--line);padding-top:44px}.about-panel.active{display:block}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.team-card{background:var(--white);border:1px solid var(--line);border-radius:2px;overflow:hidden}.team-photo{aspect-ratio:3/4;background:linear-gradient(155deg,#DCE3D9,#C7D2C1);display:flex;align-items:center;justify-content:center}.team-info{padding:18px}.team-info h4{font-size:16px;margin-bottom:4px}.team-info .role{font-size:12px;color:var(--amber);font-family:var(--font-mono);margin-bottom:8px}.team-info p{font-size:12.5px;color:var(--stone)}
.pricing-table{width:100%;border-collapse:collapse}.pricing-table th{text-align:left;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--stone);padding:10px 14px;border-bottom:1px solid var(--ink)}.pricing-table th.price{text-align:right}.pricing-table td{padding:14px;border-bottom:1px solid var(--line);font-size:14px}.pricing-table td.price{font-family:var(--font-mono);text-align:right}
.loading{text-align:center;padding:40px;color:var(--stone);font-size:18px}.error{color:var(--red);text-align:center;padding:40px;font-size:18px}
.category-group{margin-bottom:40px}.category-group h3{font-family:var(--font-display);font-size:24px;margin-bottom:16px;color:var(--jade-dark)}.category-group .cond-grid{margin-top:0}
@media(max-width:900px){.cond-grid,.cred-grid,.team-grid{grid-template-columns:1fr 1fr}.lin-grid,.hero-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site">
<div class="header-inner">
<div class="logo" onclick="navigateTo('/')">MC Balans<span class="dot">.</span></div>
<nav class="main-nav">
<a href="/" onclick="navigateTo('/')">Home</a>
<a href="/conditions" onclick="navigateTo('/conditions')">Conditions</a>
<a href="/treatments" onclick="navigateTo('/treatments')">Treatments</a>
<a href="/resources" onclick="navigateTo('/resources')">Resources</a>
<a href="/about" onclick="navigateTo('/about')">About</a>
<a href="/contact" onclick="navigateTo('/contact')">Contact</a>
</nav>
<div class="header-right">
<div class="lang-select">
<button onclick="setLang('nl')">NL</button>
<button onclick="setLang('en')" class="active">EN</button>
<button onclick="setLang('zh')">中文</button>
</div>
<div class="ask-mini"><input type="text" placeholder="Ask MC Balans…" id="miniSearchInput"></div>
</div>
</div>
</header>
<div id="app"></div>
<footer class="site">
<div class="wrap footer-grid">
<div><div class="footer-logo">MC Balans</div><p>Western & TCM, The Hague</p><p>Led by Dr. Wenzhi Lin</p></div>
<div><h5>Explore</h5><a href="/conditions" onclick="navigateTo('/conditions')">Conditions</a><a href="/treatments" onclick="navigateTo('/treatments')">Treatments</a><a href="/resources" onclick="navigateTo('/resources')">Resources</a><a href="/about" onclick="navigateTo('/about')">About</a></div>
<div><h5>Contact</h5><a href="/contact" onclick="navigateTo('/contact')">070 388 8111</a><a href="/contact" onclick="navigateTo('/contact')">info@mcbalans.nl</a><p>Mon–Fri, 9:30–17:00</p></div>
</div>
<div class="footer-bottom">© 2026 MC Balans</div>
</footer>
<script>
const API='/api';
let currentLang='en';
const app=document.getElementById('app');

function fmt(slug){if(!slug)return '';return slug.split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');}
function truncate(str,len){if(!str||str.length<=len)return str||'';const cut=str.slice(0,len);const last=cut.lastIndexOf(' ');return (last>0?cut.slice(0,last):cut).trim()+'…';}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}

const i18n={
en:{conditions:'Conditions',treatments:'Treatments',resources:'Resources',about:'About',contact:'Contact'},
nl:{conditions:'Wat we behandelen',treatments:'Behandelingen',resources:'Bronnen',about:'Over ons',contact:'Contact'},
zh:{conditions:'治疗项目',treatments:'疗法',resources:'资源',about:'关于我们',contact:'联系'}
};

function setLang(l){currentLang=l;applyTranslations();route();}
function navigateTo(url){history.pushState({},'',url);route();}
function route(){
const p=location.pathname;
if(p==='/')renderHome();
else if(p==='/conditions')renderConditions();
else if(p.startsWith('/conditions/'))renderCondition(p.split('/')[2]);
else if(p==='/treatments')renderTreatments();
else if(p.startsWith('/treatments/'))renderTreatment(p.split('/')[2]);
else if(p==='/resources')renderResources();
else if(p==='/about')renderAbout();
else if(p==='/contact')renderContact();
else renderHome();
}

async function renderHome(){
app.innerHTML='<div class="loading">Loading...</div>';
try{
const [condRes,treatRes,catRes]=await Promise.all([fetch(API+'/conditions?lang='+currentLang),fetch(API+'/treatments?lang='+currentLang),fetch(API+'/categories?lang='+currentLang)]);
if(!condRes.ok||!treatRes.ok||!catRes.ok)throw new Error('Load failed');
const conditions=await condRes.json();const treatments=await treatRes.json();const categories=await catRes.json();
let html='<section class="hero"><div class="wrap hero-grid"><div class="hero-copy"><h1>A <em>balanced</em> approach to the health of mind and body.</h1><p class="lede">Dr. Wenzhi Lin brings over 40 years of dual experience.</p><button class="btn btn-primary" onclick="navigateTo(\'/contact\')">Book an appointment</button></div><div class="hero-portrait"><div class="portrait-frame" style="aspect-ratio:4/5;background:linear-gradient(155deg,#DCE3D9,#C7D2C1);border-radius:2px;display:flex;align-items:center;justify-content:center;"><span style="font-family:var(--font-mono);font-size:12px;color:var(--jade-dark);opacity:.5;">PHOTO<br>PLACEHOLDER</span></div></div></div></section>';
html+='<section class="section"><div class="section-head"><h2>Why do patients trust Dr. Lin?</h2></div><div class="cred-grid"><div class="cred-card"><div class="num">01</div><h3>Credible</h3><p>A practising, licensed medical doctor in the Netherlands.</p></div><div class="cred-card"><div class="num">02</div><h3>Experienced</h3><p>40+ years of sustained practice across Chinese and Western medicine.</p></div><div class="cred-card"><div class="num">03</div><h3>Respected</h3><p>Monthly Medisch Dossier column, NPO documentary, Knight of Orange-Nassau (2012).</p></div><div class="cred-card"><div class="num">04</div><h3>Successful</h3><p>Reviews supporting treatment effectiveness.</p></div></div></section>';
html+='<section class="section" style="background:var(--jade-tint);"><div class="wrap"><div class="section-head"><h2>What We Treat</h2></div>';
categories.forEach(cat=>{
const catConditions=conditions.filter(c=>c.category_slug===cat.slug);
if(catConditions.length>0){
html+='<div class="category-group"><h3>'+esc(cat.name||fmt(cat.slug))+'</h3><div class="cond-grid">';
catConditions.forEach(c=>{html+=`<div class="cond-card" onclick="navigateTo('/conditions/${c.slug}')"><div><div class="tag">${cat.name||''}</div><h4>${esc(c.name||fmt(c.slug))}</h4><p>${esc(truncate(c.summary||'',110))}</p></div><div class="arrow">Explore →</div></div>`;});
html+='</div></div>';
}
});
html+='</div></section>';
html+='<section class="section"><div class="section-head"><h2>Our Treatments</h2></div><div class="cond-grid">';
treatments.forEach(t=>{html+=`<div class="cond-card" onclick="navigateTo('/treatments/${t.slug}')"><div><div class="tag">Treatment</div><h4>${esc(t.name||fmt(t.slug))}</h4><p>${esc(truncate(t.summary||'',110))}</p></div><div class="arrow">View →</div></div>`;});
html+='</div></section>';
app.innerHTML=html;
}catch(e){app.innerHTML='<div class="error">'+e.message+'</div>'}
}

async function renderConditions(){
app.innerHTML='<div class="loading">Loading...</div>';
try{
const [condRes,catRes]=await Promise.all([fetch(API+'/conditions?lang='+currentLang),fetch(API+'/categories?lang='+currentLang)]);
if(!condRes.ok||!catRes.ok)throw new Error('Load failed');
const conditions=await condRes.json();const categories=await catRes.json();
let html='<div class="subhero wrap"><div class="breadcrumb"><a onclick="navigateTo(\'/\')">Home</a> / '+i18n[currentLang].conditions+'</div><h1>'+i18n[currentLang].conditions+'</h1></div><section class="section"><div class="wrap">';
categories.forEach(cat=>{
const catConditions=conditions.filter(c=>c.category_slug===cat.slug);
if(catConditions.length>0){
html+='<div class="category-group"><h3>'+esc(cat.name||fmt(cat.slug))+'</h3><div class="cond-grid">';
catConditions.forEach(c=>{html+=`<div class="cond-card" onclick="navigateTo('/conditions/${c.slug}')"><div><div class="tag">${cat.name||''}</div><h4>${esc(c.name||fmt(c.slug))}</h4><p>${esc(truncate(c.summary||'',110))}</p></div><div class="arrow">Explore →</div></div>`;});
html+='</div></div>';
}
});
html+='</div></section>';app.innerHTML=html;
}catch(e){app.innerHTML='<div class="error">'+e.message+'</div>'}
}

async function renderCondition(slug){
app.innerHTML='<div class="loading">Loading...</div>';
try{
const res=await fetch(API+'/conditions/'+slug+'?lang='+currentLang);
if(!res.ok)throw new Error('Condition not found');
const data=await res.json();
const c=data.condition;const nome=c.name||fmt(c.slug);
let html='<div class="subhero wrap"><div class="breadcrumb"><a onclick="navigateTo(\'/\')">Home</a> / <a onclick="navigateTo(\'/conditions\')">'+i18n[currentLang].conditions+'</a> / '+nome+'</div><h1>'+nome+'</h1><p class="lede">'+(c.summary||'')+'</p><div class="stamp-strip" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;"><span style="font-size:11px;background:var(--jade-tint);color:var(--jade);padding:5px 10px;border-radius:100px;">Licensed MD</span><span style="font-size:11px;background:var(--jade-tint);color:var(--jade);padding:5px 10px;border-radius:100px;">40+ Years</span><span style="font-size:11px;background:var(--jade-tint);color:var(--jade);padding:5px 10px;border-radius:100px;">Orange-Nassau</span><span style="font-size:11px;background:var(--jade-tint);color:var(--jade);padding:5px 10px;border-radius:100px;">Medisch Dossier</span></div></div><div class="condition-content">';
if(c.recognition)html+='<h2>Recognition</h2><div style="background:var(--white);border:1px solid var(--line);padding:24px;border-radius:4px;">'+c.recognition.replace(/\n/g,'<br>')+'</div>';else html+='<h2>Recognition</h2><div class="placeholder-box">Content pending</div>';
if(c.red_flags)html+='<h2>Red Flags</h2><div style="background:var(--amber-tint);border-left:4px solid var(--red);padding:24px;border-radius:4px;">'+c.red_flags.replace(/\n/g,'<br>')+'</div>';else html+='<h2>Red Flags</h2><div class="placeholder-box">Content pending</div>';
if(c.understanding)html+='<h2>Understanding</h2><p>'+c.understanding.replace(/\n/g,'<br>')+'</p>';else html+='<h2>Understanding</h2><div class="placeholder-box">Content pending</div>';
if(c.approach)html+='<h2>The MC Balans Approach</h2><div style="background:var(--jade-tint);padding:24px;border-radius:4px;">'+c.approach.replace(/\n/g,'<br>')+'</div>';else html+='<h2>The MC Balans Approach</h2><div class="placeholder-box">Content pending</div>';
if(c.assessment)html+='<h2>Assessment</h2><p>'+c.assessment.replace(/\n/g,'<br>')+'</p>';else html+='<h2>Assessment</h2><div class="placeholder-box">Content pending</div>';
html+='</div>';
// Treatments section (with practitioners and pricing)
if(data.treatments.length>0){
html+='<section class="section"><div class="wrap"><div class="section-head"><h2>Treatments</h2></div><div class="cond-grid">';
data.treatments.forEach(t=>{
html+=`<div class="cond-card" onclick="navigateTo('/treatments/${t.slug}')"><div><div class="tag">Treatment</div><h4>${esc(t.name||fmt(t.slug))}</h4><p>${esc(truncate(t.summary||'',100))}</p>`;
if(t.practitioners&&t.practitioners.length>0){html+='<div style="margin-top:8px;"><strong>Practitioners:</strong> '+t.practitioners.map(p=>p.email).join(', ')+'</div>';}
if(t.pricing&&t.pricing.length>0){html+='<div style="margin-top:4px;color:var(--jade);"><strong>From:</strong> €'+Math.min(...t.pricing.map(p=>parseFloat(p.amount)))+'</div>';}
html+='</div><div class="arrow">View →</div></div>';
});
html+='</div></div></section>';
}
// FAQ section
if(data.faqs.length>0){
html+='<section class="section"><div class="wrap"><h2>FAQ</h2>';
data.faqs.forEach(f=>{html+='<div class="faq-item"><div class="q">'+esc(f.question)+'</div><div class="a">'+esc(f.answer)+'</div></div>';});
html+='</div></section>';
}
html+='<div style="text-align:center;padding:40px;"><button class="btn btn-primary" onclick="navigateTo(\'/contact\')">Book an appointment</button></div>';
app.innerHTML=html;
}catch(e){app.innerHTML='<div class="error">'+e.message+'</div>'}
}

async function renderTreatments(){
app.innerHTML='<div class="loading">Loading...</div>';
try{
const res=await fetch(API+'/treatments?lang='+currentLang);
if(!res.ok)throw new Error('Load failed');
const data=await res.json();
let html='<div class="subhero wrap"><div class="breadcrumb"><a onclick="navigateTo(\'/\')">Home</a> / '+i18n[currentLang].treatments+'</div><h1>'+i18n[currentLang].treatments+'</h1></div><section class="section"><div class="cond-grid">';
data.forEach(t=>{html+=`<div class="cond-card" onclick="navigateTo('/treatments/${t.slug}')"><div><div class="tag">Treatment</div><h4>${esc(t.name||fmt(t.slug))}</h4><p>${esc(truncate(t.summary||'',110))}</p></div><div class="arrow">View →</div></div>`;});
html+='</div></section>';app.innerHTML=html;
}catch(e){app.innerHTML='<div class="error">'+e.message+'</div>'}
}

async function renderTreatment(slug){
app.innerHTML='<div class="loading">Loading...</div>';
try{
const res=await fetch(API+'/treatments/'+slug+'?lang='+currentLang);
if(!res.ok)throw new Error('Treatment not found');
const data=await res.json();
const t=data.treatment;const nome=t.name||fmt(t.slug);
let html='<div class="subhero wrap"><div class="breadcrumb"><a onclick="navigateTo(\'/\')">Home</a> / <a onclick="navigateTo(\'/treatments\')">'+i18n[currentLang].treatments+'</a> / '+nome+'</div><h1>'+nome+'</h1><p class="lede">'+(t.summary||'')+'</p></div><div class="condition-content">';
if(t.body)html+='<h2>Overview</h2><p>'+t.body.replace(/\n/g,'<br>')+'</p>';
if(data.conditions.length>0){html+='<h2>Conditions Treated</h2><ul>';data.conditions.forEach(c=>{html+='<li><a style="color:var(--jade);cursor:pointer;" onclick="navigateTo(\'/conditions/'+c.slug+'\')">'+(c.name||fmt(c.slug))+'</a></li>';});html+='</ul>';}
html+='</div><div style="text-align:center;padding:40px;"><button class="btn btn-primary" onclick="navigateTo(\'/contact\')">Book an appointment</button></div>';
app.innerHTML=html;
}catch(e){app.innerHTML='<div class="error">'+e.message+'</div>'}
}

async function renderAbout(){
app.innerHTML='<div class="loading">Loading...</div>';
try{
const [teamRes,priceRes]=await Promise.all([fetch(API+'/practitioners'),fetch(API+'/pricing')]);
if(!teamRes.ok)throw new Error('Failed');
const team=await teamRes.json();const prices=priceRes.ok?await priceRes.json():[];
let html='<div class="subhero wrap"><div class="breadcrumb"><a onclick="navigateTo(\'/\')">Home</a> / About</div><h1>About MC Balans</h1><p class="lede">Meet the team, see the clinic, check pricing, or read about our approach.</p><div class="about-tabs"><div class="about-tab active" onclick="aboutTab(\'ourteam\')">Our Team</div><div class="about-tab" onclick="aboutTab(\'ourclinic\')">Our Clinic</div><div class="about-tab" onclick="aboutTab(\'pricing\')">Pricing</div><div class="about-tab" onclick="aboutTab(\'philosophy\')">Philosophy</div></div></div><section class="section"><div class="wrap">';
html+='<div class="about-panel active" id="panel-ourteam"><div class="section-head"><h2>Our Team</h2></div><div class="team-grid">';team.forEach(m=>{const roles=Array.isArray(m.roles)?m.roles.join(', '):(m.roles||'');html+=`<div class="team-card"><div class="team-photo"><span>PHOTO</span></div><div class="team-info"><h4>${esc(m.name?m.name:fmt(m.id))}</h4><div class="role">${esc(roles)}</div><p>${esc(m.email||'')}</p></div></div>`;});html+='</div></div>';
html+='<div class="about-panel" id="panel-ourclinic"><div class="section-head"><h2>Our Clinic</h2></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;"><div class="placeholder-box">Clinic photo 1</div><div class="placeholder-box">Clinic photo 2</div></div><p style="margin-top:24px;color:var(--stone);">Our clinic is located in The Hague. We offer a calm, professional environment for your care.</p></div>';
html+='<div class="about-panel" id="panel-pricing"><div class="section-head"><h2>Pricing</h2></div><table class="pricing-table"><thead><tr><th>Treatment</th><th>Label</th><th class="price">Price</th></tr></thead><tbody>';prices.forEach(p=>{html+=`<tr onclick="navigateTo('/${p.entity_type}s/${p.entity_slug}')"><td>${esc(p.entity_slug?fmt(p.entity_slug):'')}</td><td>${esc(p.tier_label||'')}</td><td class="price">€${p.amount}</td></tr>`;});html+='</tbody></table></div>';
html+='<div class="about-panel" id="panel-philosophy"><div class="section-head"><h2>Our Philosophy</h2></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;"><div class="placeholder-box">Vision</div><div class="placeholder-box">Mission</div></div></div>';
html+='</div></section>';app.innerHTML=html;
}catch(e){app.innerHTML='<div class="error">'+e.message+'</div>'}
}
function aboutTab(tab){document.querySelectorAll('.about-tab').forEach(t=>t.classList.toggle('active',t.textContent.toLowerCase().replace(' ','')===tab));document.querySelectorAll('.about-panel').forEach(p=>p.classList.remove('active'));const panel=document.getElementById('panel-'+tab);if(panel)panel.classList.add('active');}
