<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MC Balans Admin</title>
<style>
  :root { --jade:#2b6e5c; --line:#e0e0e0; --bg:#f7f7f5; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; margin:0; background:var(--bg); color:#1a1a1a; line-height:1.5; }
  header { background:#1a1a1a; color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header button { background:transparent; color:#fff; border:1px solid #555; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
  nav { background:#fff; border-bottom:1px solid var(--line); padding:0 24px; display:flex; gap:0; flex-wrap:wrap; }
  nav button { background:none; border:none; padding:14px 18px; font-size:14px; font-weight:600; color:#666; cursor:pointer; border-bottom:2px solid transparent; }
  nav button.active { color:var(--jade); border-bottom-color:var(--jade); }
  main { max-width:820px; margin:32px auto; padding:0 24px; }
  select, input, textarea { font-family:inherit; font-size:15px; width:100%; padding:10px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  textarea { min-height:140px; font-family:ui-monospace, Menlo, monospace; font-size:13px; line-height:1.6; }
  label { display:block; margin-top:20px; }
  label strong { display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:#666; margin-bottom:6px; }
  .row { display:flex; gap:12px; align-items:center; margin-top:20px; }
  .row select { flex:1; }
  button.primary { background:var(--jade); color:#fff; border:none; padding:10px 22px; border-radius:4px; cursor:pointer; font-size:15px; font-weight:600; }
  button.primary:disabled { opacity:0.5; cursor:not-allowed; }
  button.secondary { background:#fff; color:var(--jade); border:1px solid var(--jade); padding:10px 18px; border-radius:4px; cursor:pointer; font-size:14px; font-weight:600; }
  .status { font-size:14px; color:#666; }
  .status.ok { color:var(--jade); font-weight:600; }
  .status.err { color:#b00; }
  .hidden { display:none !important; }
  #modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:flex-start; justify-content:center; padding:60px 20px; z-index:100; }
  #modal { background:#fff; border-radius:8px; max-width:520px; width:100%; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,0.3); max-height:90vh; overflow-y:auto; }
  #modal h2 { margin:0 0 8px; font-size:20px; }
  #modal p.hint { color:#666; font-size:13px; margin-top:0; margin-bottom:20px; }
  .modal-actions { display:flex; gap:10px; margin-top:28px; align-items:center; }
</style>
</head>
<body>
<header>
  <h1>MC Balans — Content admin</h1>
  <form method="POST" action="/admin/logout" style="margin:0;">
    <button type="submit">Log out</button>
  </form>
</header>

<nav id="tabs"></nav>

<main>
  <div class="row">
    <select id="picker"><option value="">Loading…</option></select>
    <button type="button" id="newBtn" class="secondary hidden">+ New condition</button>
  </div>

  <form id="form" style="display:none;">
    <div id="fields"></div>
    <div class="row" style="margin-top:32px;">
      <button class="primary" type="submit" id="save">Save</button>
      <span class="status" id="status"></span>
    </div>
  </form>
</main>

<div id="modal-backdrop" class="hidden">
  <div id="modal">
    <h2>New condition</h2>
    <p class="hint">Creates a new row with empty body fields. Pick it from the dropdown afterwards to fill in the content.</p>

    <form id="createForm">
      <label><strong>Name</strong><input type="text" name="name" required autofocus></label>
      <label><strong>Slug</strong><input type="text" name="slug" required placeholder="auto-generated from name"></label>
      <label><strong>Category</strong><select name="category_id" required><option value="">Loading…</option></select></label>
      <label><strong>Author</strong><select name="author_id" required><option value="">Loading…</option></select></label>
      <label><strong>Medical reviewer</strong><select name="medical_reviewer_id"><option value="">— same as author —</option></select></label>
      <label><strong>Status</strong><select name="status"><option value="draft">draft</option><option value="in_review">in_review</option><option value="medically_reviewed">medically_reviewed</option><option value="approved">approved</option><option value="published">published</option><option value="archived">archived</option></select></label>

      <div class="modal-actions">
        <button type="submit" class="primary">Create</button>
        <button type="button" id="cancelBtn" class="secondary">Cancel</button>
        <span class="status" id="modalStatus"></span>
      </div>
    </form>
  </div>
</div>

<script>
const HIDDEN = {
  conditions: new Set(['id','slug','created_at','updated_at','category_id','author_id','medical_reviewer_id','search_vector','ai_summary']),
  treatments: new Set(['id','slug','created_at','updated_at','parent_treatment_id','intake_text_block_id','treatment_selection_approach_id','insurance_coverage_block_id','author_id','medical_reviewer_id','search_vector']),
  shared_content_blocks: new Set(['id','created_at','updated_at','block_type']),
  ui_strings: new Set(['id','updated_at','string_key','locale'])
};
const LONG = new Set(['summary','recognition','red_flags','understanding','approach','assessment','expectations','practical','intake','aftercare','lede','body','value','name','treatment_selection_approach']);

const tabsEl = document.getElementById('tabs');
const picker = document.getElementById('picker');
const form = document.getElementById('form');
const fieldsEl = document.getElementById('fields');
const statusEl = document.getElementById('status');
const saveBtn = document.getElementById('save');
const newBtn = document.getElementById('newBtn');
const backdrop = document.getElementById('modal-backdrop');
const createForm = document.getElementById('createForm');
const modalStatus = document.getElementById('modalStatus');
let currentTable = null;
let currentKey = '';
let meta = null;

function slugify(s) {
  return s.toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-{2,}/g, '-')
    .replace(/^-+|-+$/g, '');
}

async function loadTabs() {
  const r = await fetch('/admin/api/tables');
  if (!r.ok) { location.href = '/admin/login'; return; }
  const tables = await r.json();
  tabsEl.innerHTML = tables.map(t => '<button data-tab="' + t.key + '">' + esc(t.label) + '</button>').join('');
  tabsEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => selectTab(b.dataset.tab)));
  selectTab(tables[0].key);
}

function pickerValue(tableKey, row) {
  if (tableKey === 'ui_strings' || tableKey === 'shared_content_blocks') return row.id;
  return row.slug;
}
function pickerLabel(tableKey, row) {
  if (tableKey === 'ui_strings') return row.string_key + ' [' + row.locale + ']';
  if (tableKey === 'shared_content_blocks') {
    const preview = (row.value || '').slice(0, 60);
    return row.id + ' — ' + preview + (row.value && row.value.length > 60 ? '…' : '');
  }
  const id = row.id ? row.id + ' — ' : '';
  return id + (row.name || row.slug || '');
}

async function selectTab(tableKey) {
  currentTable = tableKey;
  tabsEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.tab === tableKey));
  form.style.display = 'none';
  statusEl.textContent = '';
  newBtn.classList.toggle('hidden', tableKey !== 'conditions');
  picker.innerHTML = '<option>Loading…</option>';
  const r = await fetch('/admin/api/list/' + tableKey);
  if (!r.ok) { picker.innerHTML = '<option>Error</option>'; return; }
  const rows = await r.json();
  picker.innerHTML = '<option value="">— pick one —</option>' +
    rows.map(row => '<option value="' + esc(pickerValue(tableKey, row)) + '">' + esc(pickerLabel(tableKey, row)) + '</option>').join('');
}

async function loadRow(key) {
  statusEl.textContent = ''; statusEl.className = 'status';
  if (!key) { form.style.display = 'none'; currentKey = ''; return; }
  const r = await fetch('/admin/api/row/' + currentTable + '/' + encodeURIComponent(key));
  if (!r.ok) { statusEl.textContent = 'Failed to load'; statusEl.className = 'status err'; return; }
  const row = await r.json();
  renderForm(row);
  form.style.display = 'block';
  currentKey = key;
}

function renderForm(row) {
  fieldsEl.innerHTML = '';
  const hidden = HIDDEN[currentTable] || new Set();
  for (const key of Object.keys(row)) {
    if (hidden.has(key)) continue;
    const value = row[key];
    const isLong = LONG.has(key) || (typeof value === 'string' && value.length > 100);
    const label = document.createElement('label');
    label.innerHTML = '<strong>' + esc(key.replace(/_/g, ' ')) + '</strong>';
    const input = document.createElement(isLong ? 'textarea' : 'input');
    if (!isLong) input.type = 'text';
    input.name = key;
    input.value = value == null ? '' : value;
    label.appendChild(input);
    fieldsEl.appendChild(label);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!currentKey) return;
  saveBtn.disabled = true;
  statusEl.textContent = 'Saving…'; statusEl.className = 'status';
  const body = {};
  for (const el of form.querySelectorAll('input[name], textarea[name]')) body[el.name] = el.value;
  try {
    const r = await fetch('/admin/api/row/' + currentTable + '/' + encodeURIComponent(currentKey), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || 'Save failed');
    statusEl.textContent = 'Saved ✓'; statusEl.className = 'status ok';
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message; statusEl.className = 'status err';
  } finally {
    saveBtn.disabled = false;
  }
});

picker.addEventListener('change', () => loadRow(picker.value));

async function loadMeta() {
  const r = await fetch('/admin/api/meta');
  if (!r.ok) return;
  meta = await r.json();
  const catSel = createForm.querySelector('[name="category_id"]');
  const authSel = createForm.querySelector('[name="author_id"]');
  const revSel = createForm.querySelector('[name="medical_reviewer_id"]');
  catSel.innerHTML = '<option value="">— pick a category —</option>' +
    meta.categories.map(c => '<option value="' + esc(c.id) + '">' + esc(c.id + ' — ' + c.name) + '</option>').join('');
  const pracOpts = meta.practitioners.map(p => '<option value="' + esc(p.id) + '">' + esc(p.id + (p.role ? ' — ' + p.role : '')) + '</option>').join('');
  authSel.innerHTML = '<option value="">— pick an author —</option>' + pracOpts;
  revSel.innerHTML = '<option value="">— same as author —</option>' + pracOpts;
}

newBtn.addEventListener('click', async () => {
  if (!meta) await loadMeta();
  createForm.reset();
  modalStatus.textContent = ''; modalStatus.className = 'status';
  backdrop.classList.remove('hidden');
  createForm.querySelector('[name="name"]').focus();
});

document.getElementById('cancelBtn').addEventListener('click', () => {
  backdrop.classList.add('hidden');
});

backdrop.addEventListener('click', (e) => {
  if (e.target === backdrop) backdrop.classList.add('hidden');
});

createForm.querySelector('[name="name"]').addEventListener('input', (e) => {
  const slugField = createForm.querySelector('[name="slug"]');
  if (!slugField.dataset.touched) slugField.value = slugify(e.target.value);
});
createForm.querySelector('[name="slug"]').addEventListener('input', (e) => {
  e.target.dataset.touched = '1';
});

createForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  modalStatus.textContent = 'Creating…'; modalStatus.className = 'status';
  const body = {};
  for (const el of createForm.querySelectorAll('input, select')) body[el.name] = el.value;
  try {
    const r = await fetch('/admin/api/conditions/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || 'Create failed');
    backdrop.classList.add('hidden');
    await selectTab('conditions');
    picker.value = out.slug;
    await loadRow(out.slug);
    statusEl.textContent = 'Created ' + out.id; statusEl.className = 'status ok';
  } catch (err) {
    modalStatus.textContent = 'Error: ' + err.message; modalStatus.className = 'status err';
  }
});

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

loadTabs();
</script>
</body>
</html>
