<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MC Balans Admin</title>
<style>
  :root { --jade:#2b6e5c; --line:#e0e0e0; --bg:#f7f7f5; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; margin:0; background:var(--bg); color:#1a1a1a; line-height:1.5; }
  header { background:#1a1a1a; color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header button { background:transparent; color:#fff; border:1px solid #555; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
  main { max-width:820px; margin:32px auto; padding:0 24px; }
  select, input, textarea { font-family:inherit; font-size:15px; width:100%; padding:10px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  textarea { min-height:140px; font-family:ui-monospace, Menlo, monospace; font-size:13px; line-height:1.6; }
  label { display:block; margin-top:20px; }
  label strong { display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:#666; margin-bottom:6px; }
  .row { display:flex; gap:12px; align-items:center; margin-top:20px; }
  .row select { flex:1; }
  button.primary { background:var(--jade); color:#fff; border:none; padding:10px 22px; border-radius:4px; cursor:pointer; font-size:15px; font-weight:600; }
  button.primary:disabled { opacity:0.5; cursor:not-allowed; }
  .status { font-size:14px; color:#666; }
  .status.ok { color:var(--jade); font-weight:600; }
  .status.err { color:#b00; }
  .hint { font-size:13px; color:#888; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>MC Balans — Content admin</h1>
  <form method="POST" action="/admin/logout" style="margin:0;">
    <button type="submit">Log out</button>
  </form>
</header>

<main>
  <div class="row">
    <select id="picker"><option value="">Loading conditions…</option></select>
  </div>

  <form id="form" style="display:none;">
    <div id="fields"></div>
    <div class="row" style="margin-top:32px;">
      <button class="primary" type="submit" id="save">Save</button>
      <span class="status" id="status"></span>
    </div>
  </form>
</main>

<script>
const HIDDEN_FIELDS = new Set([
  'id', 'slug', 'created_at', 'updated_at',
  'category_id', 'author_id', 'medical_reviewer'
]);
const LONG_FIELDS = new Set([
  'summary', 'recognition', 'red_flags', 'understanding', 'approach',
  'assessment', 'expectations', 'practical', 'intake', 'aftercare',
  'lede', 'body', 'name'
]);

const picker = document.getElementById('picker');
const form = document.getElementById('form');
const fieldsEl = document.getElementById('fields');
const statusEl = document.getElementById('status');
const saveBtn = document.getElementById('save');
let currentSlug = '';

async function loadList() {
  const r = await fetch('/admin/api/conditions');
  if (!r.ok) { location.href = '/admin/login'; return; }
  const rows = await r.json();
  picker.innerHTML = '<option value="">— pick a condition —</option>' +
    rows.map(c => '<option value="' + esc(c.slug) + '">' + esc(c.id) + ' — ' + esc(c.name) + '</option>').join('');
}

async function loadCondition(slug) {
  statusEl.textContent = ''; statusEl.className = 'status';
  if (!slug) { form.style.display = 'none'; currentSlug = ''; return; }
  const r = await fetch('/admin/api/condition/' + encodeURIComponent(slug));
  if (!r.ok) { statusEl.textContent = 'Failed to load'; statusEl.className = 'status err'; return; }
  const row = await r.json();
  renderForm(row);
  form.style.display = 'block';
  currentSlug = slug;
}

function renderForm(row) {
  fieldsEl.innerHTML = '';
  for (const key of Object.keys(row)) {
    if (HIDDEN_FIELDS.has(key)) continue;
    const value = row[key];
    const isLong = LONG_FIELDS.has(key) || (typeof value === 'string' && value.length > 100);
    const label = document.createElement('label');
    label.innerHTML = '<strong>' + esc(key.replace(/_/g, ' ')) + '</strong>';
    const input = document.createElement(isLong ? 'textarea' : 'input');
    if (!isLong) input.type = 'text';
    input.name = key;
    input.value = value == null ? '' : value;
    label.appendChild(input);
    fieldsEl.appendChild(label);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!currentSlug) return;
  saveBtn.disabled = true;
  statusEl.textContent = 'Saving…'; statusEl.className = 'status';

  const body = {};
  for (const el of form.querySelectorAll('input[name], textarea[name]')) {
    body[el.name] = el.value;
  }

  try {
    const r = await fetch('/admin/api/condition/' + encodeURIComponent(currentSlug), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || 'Save failed');
    statusEl.textContent = 'Saved ✓'; statusEl.className = 'status ok';
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message; statusEl.className = 'status err';
  } finally {
    saveBtn.disabled = false;
  }
});

picker.addEventListener('change', () => loadCondition(picker.value));

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

loadList();
</script>
</body>
</html>
